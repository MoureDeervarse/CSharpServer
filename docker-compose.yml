version: '3.8'

services:
  mysql:
    image: mysql:latest
    pull_policy: missing
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: game_db_0
      MYSQL_ROOT_PASSWORD: pass1234#
      MYSQL_USER: admin
      MYSQL_PASSWORD: pass1234@
    volumes:
      - ./volumes/mysql:/var/lib/mysql

volumes:
  mysql_data: